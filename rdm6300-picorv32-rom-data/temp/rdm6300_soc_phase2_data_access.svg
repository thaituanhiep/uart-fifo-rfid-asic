<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1740" width="1800" height="1740">
  <defs>
    <marker id="arrowhead" markerWidth="14" markerHeight="10" refX="12" refY="5" orient="auto">
      <polygon points="0 0, 14 5, 0 10" fill="#000000" />
    </marker>
  </defs>
  <rect width="1800" height="1740" fill="#ffffff"/>
  <rect x="20" y="20" width="1760" height="80" fill="#ffffff" stroke="#000000" stroke-width="2.5" rx="6"/>
  <text x="900" y="54" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#000000" text-anchor="middle">CHẶNG 2: TRUY XUẤT DỮ LIỆU TỪ 1KB SRAM (DATA MEMORY ACCESS)</text>
  <text x="900" y="84" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#444444" text-anchor="middle">Ví dụ: Lệnh lw a0, 0(sp) đọc biến local_var từ đỉnh Stack sp = 0x0000_03F0 — rdm6300_picorv32_soc.v#tên_biến (module nguồn, module đích)</text>
  <rect x="20" y="115" width="560" height="115" fill="#ffffff" stroke="#000000" stroke-width="2.5" rx="6"/>
  <text x="300" y="150" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#000000" text-anchor="middle">CỘT 1: PicoRV32 CPU (MASTER)</text>
  <text x="300" y="180" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#444444" text-anchor="middle">File nguồn: rtl/picorv32.v</text>
  <text x="300" y="208" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#444444" text-anchor="middle">Giải mã opcode, phát chu kỳ đọc Stack: mem_valid, mem_addr</text>
  <rect x="620" y="115" width="560" height="115" fill="#ffffff" stroke="#000000" stroke-width="2.5" rx="6"/>
  <text x="900" y="150" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#000000" text-anchor="middle">CỘT 2: soc_interconnect (TRỌNG TÀI BUS)</text>
  <text x="900" y="180" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#444444" text-anchor="middle">File nguồn: rtl/soc_interconnect.v</text>
  <text x="900" y="208" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#444444" text-anchor="middle">Giải mã địa chỉ, bật sel_sram = 1, ghép sram_rdata về CPU</text>
  <rect x="1220" y="115" width="560" height="115" fill="#ffffff" stroke="#000000" stroke-width="2.5" rx="6"/>
  <text x="1500" y="150" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#000000" text-anchor="middle">CỘT 3: 1KB ON-CHIP DATA SRAM (SLAVE 0)</text>
  <text x="1500" y="180" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#444444" text-anchor="middle">File nguồn: rtl/data_sram.v (256 từ x 32-bit = 1024 Bytes)</text>
  <text x="1500" y="208" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#444444" text-anchor="middle">Dải địa chỉ SRAM: 0x0000_0000 - 0x0000_03FF</text>
  <line x1="300" y1="230" x2="300" y2="1720" stroke="#888888" stroke-width="2" stroke-dasharray="8,8"/>
  <line x1="900" y1="230" x2="900" y2="1720" stroke="#888888" stroke-width="2" stroke-dasharray="8,8"/>
  <line x1="1500" y1="230" x2="1500" y2="1720" stroke="#888888" stroke-width="2" stroke-dasharray="8,8"/>
  <rect x="20" y="245" width="1760" height="55" fill="#ffffff" stroke="#000000" stroke-width="2" rx="4"/>
  <text x="900" y="280" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#000000" text-anchor="middle">[TIỀN ĐỀ] ALU tính addr = 32'h0000_03F0 (SRAM). SPI Flash nghỉ ngơi: sel_spimem = 0 (CS_N giữ mức cao 1'b1)</text>
  <rect x="20" y="320" width="560" height="170" fill="#ffffff" stroke="#000000" stroke-width="2.5" rx="6"/>
  <text x="42" y="356" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#000000">Bước 7: CPU phát chu kỳ đọc Stack SRAM</text>
  <line x1="35" y1="368" x2="565" y2="368" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="42" y="400" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#111111">• mem_valid = 1 & mem_instr = 0 (Đọc dữ liệu)</text>
  <text x="42" y="434" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#111111">• mem_addr = 0x0000_03F0 (Địa chỉ đỉnh Stack)</text>
  <text x="42" y="468" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#111111">• mem_wstrb = 4'b0000 (Chu kỳ đọc, không ghi)</text>
  <rect x="620" y="620" width="560" height="170" fill="#ffffff" stroke="#000000" stroke-width="2.5" rx="6"/>
  <text x="642" y="656" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#000000">Bước 8: Interconnect giải mã chọn SRAM</text>
  <line x1="635" y1="668" x2="1165" y2="668" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="642" y="700" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#111111">• So khớp: 32'h0000_03F0 < 32'h0000_0400</text>
  <text x="642" y="734" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#111111">• Bật sel_sram = 1 (Kích hoạt khối 1KB Data SRAM)</text>
  <text x="642" y="768" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#111111">• Khóa sel_spimem = 0 (Bộ điều khiển Flash nghỉ)</text>
  <rect x="1220" y="920" width="560" height="170" fill="#ffffff" stroke="#000000" stroke-width="2.5" rx="6"/>
  <text x="1242" y="956" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#000000">Bước 9: SRAM đọc ô nhớ & Phản hồi (1 cycle)</text>
  <line x1="1235" y1="968" x2="1765" y2="968" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="1242" y="1000" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#111111">• Đọc mem[addr] trong rtl/data_sram.v (Stack 0x3F0)</text>
  <text x="1242" y="1034" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#111111">• sram_rdata = Giá trị biến local_var từ Stack</text>
  <text x="1242" y="1068" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#111111">• sram_ready = 1 (Phản hồi tức thì trong 1 cycle 20ns)</text>
  <rect x="620" y="1220" width="560" height="135" fill="#ffffff" stroke="#000000" stroke-width="2.5" rx="6"/>
  <text x="642" y="1256" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#000000">Bước 10: Interconnect ghép dữ liệu về CPU</text>
  <line x1="635" y1="1268" x2="1165" y2="1268" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="642" y="1300" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#111111">• mem_rdata = sram_rdata (Chuyển dữ liệu biến)</text>
  <text x="642" y="1334" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#111111">• mem_ready = sram_ready = 1 (Báo CPU chốt)</text>
  <rect x="20" y="1485" width="560" height="205" fill="#ffffff" stroke="#000000" stroke-width="2.5" rx="6"/>
  <text x="42" y="1521" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#000000">Bước 11: CPU chốt dữ liệu vào a0 & Hoàn tất</text>
  <line x1="35" y1="1533" x2="565" y2="1533" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="42" y="1565" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#111111">• Ghi cpuregs[10] = mem_rdata (Thanh ghi a0/x10)</text>
  <text x="42" y="1599" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#111111">• Hạ mem_valid = 0 (Kết thúc chu kỳ đọc dữ liệu)</text>
  <text x="42" y="1633" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#111111">• Tăng reg_pc = reg_pc + 4 (Chuyển sang lệnh kế)</text>
  <text x="42" y="1667" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#111111">• LỆNH FIRMWARE HOÀN TẤT THỰC THI 100%!</text>
  <line x1="300" y1="560" x2="900" y2="560" stroke="#000000" stroke-width="3.5" marker-end="url(#arrowhead)"/>
  <rect x="340" y="506" width="520" height="44" fill="#ffffff" fill-opacity="0.96" stroke="#b0b0b0" stroke-width="1.2" rx="5"/>
  <text x="600" y="529" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#000000" text-anchor="middle">rdm6300_picorv32_soc.v#mem_valid, #mem_addr</text>
  <text x="600" y="547" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#2b6cb0" text-anchor="middle">(từ picorv32 ➔ soc_interconnect)</text>
  <line x1="900" y1="860" x2="1500" y2="860" stroke="#000000" stroke-width="3.5" marker-end="url(#arrowhead)"/>
  <rect x="940" y="806" width="520" height="44" fill="#ffffff" fill-opacity="0.96" stroke="#b0b0b0" stroke-width="1.2" rx="5"/>
  <text x="1200" y="829" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#000000" text-anchor="middle">rdm6300_picorv32_soc.v#sel_sram</text>
  <text x="1200" y="847" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#2b6cb0" text-anchor="middle">(từ soc_interconnect ➔ data_sram)</text>
  <line x1="1500" y1="1160" x2="900" y2="1160" stroke="#000000" stroke-width="3.5" marker-end="url(#arrowhead)"/>
  <rect x="940" y="1106" width="520" height="44" fill="#ffffff" fill-opacity="0.96" stroke="#b0b0b0" stroke-width="1.2" rx="5"/>
  <text x="1200" y="1129" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#000000" text-anchor="middle">rdm6300_picorv32_soc.v#sram_rdata, #sram_ready</text>
  <text x="1200" y="1147" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#2b6cb0" text-anchor="middle">(từ data_sram ➔ soc_interconnect)</text>
  <line x1="900" y1="1425" x2="300" y2="1425" stroke="#000000" stroke-width="3.5" marker-end="url(#arrowhead)"/>
  <rect x="340" y="1371" width="520" height="44" fill="#ffffff" fill-opacity="0.96" stroke="#b0b0b0" stroke-width="1.2" rx="5"/>
  <text x="600" y="1394" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#000000" text-anchor="middle">rdm6300_picorv32_soc.v#mem_rdata, #mem_ready</text>
  <text x="600" y="1412" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#2b6cb0" text-anchor="middle">(từ soc_interconnect ➔ picorv32)</text>
</svg>