<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1865" width="1800" height="1865">
  <defs>
    <marker id="arrowhead" markerWidth="14" markerHeight="10" refX="12" refY="5" orient="auto">
      <polygon points="0 0, 14 5, 0 10" fill="#000000" />
    </marker>
  </defs>
  <rect width="1800" height="1865" fill="#ffffff"/>
  <rect x="20" y="20" width="1760" height="80" fill="#ffffff" stroke="#000000" stroke-width="2.5" rx="6"/>
  <text x="900" y="54" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#000000" text-anchor="middle">CHẶNG 1: NẠP MÃ LỆNH TỪ SPI FLASH QUA SOC_INTERCONNECT (INSTRUCTION FETCH - XIP)</text>
  <text x="900" y="84" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#444444" text-anchor="middle">Ví dụ: Nạp mã lệnh lw a0, 0(sp) tại PC = 0x0025_0000 — Tín hiệu trên các mũi tên: rdm6300_picorv32_soc.v#tên_biến (module nguồn, module đích)</text>
  <rect x="20" y="115" width="560" height="115" fill="#ffffff" stroke="#000000" stroke-width="2.5" rx="6"/>
  <text x="300" y="150" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#000000" text-anchor="middle">CỘT 1: PicoRV32 CPU (MASTER)</text>
  <text x="300" y="180" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#444444" text-anchor="middle">File nguồn: rtl/picorv32.v</text>
  <text x="300" y="208" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#444444" text-anchor="middle">Phát chu kỳ bus: mem_valid, mem_addr, mem_wstrb</text>
  <rect x="620" y="115" width="560" height="115" fill="#ffffff" stroke="#000000" stroke-width="2.5" rx="6"/>
  <text x="900" y="150" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#000000" text-anchor="middle">CỘT 2: soc_interconnect (TRỌNG TÀI BUS)</text>
  <text x="900" y="180" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#444444" text-anchor="middle">File nguồn: rtl/soc_interconnect.v</text>
  <text x="900" y="208" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#444444" text-anchor="middle">Giải mã địa chỉ, bật sel_spimem = 1, ghép cpu_mem_rdata</text>
  <rect x="1220" y="115" width="560" height="115" fill="#ffffff" stroke="#000000" stroke-width="2.5" rx="6"/>
  <text x="1500" y="150" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#000000" text-anchor="middle">CỘT 3: BỘ ĐIỀU KHIỂN SPI FLASH (SLAVE 1)</text>
  <text x="1500" y="180" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#444444" text-anchor="middle">File nguồn: rtl/spimemio.v (Chip Flash W25Q128)</text>
  <text x="1500" y="208" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#444444" text-anchor="middle">Dải địa chỉ Flash: 0x0010_0000 - 0x00FF_FFFF</text>
  <line x1="300" y1="230" x2="300" y2="1845" stroke="#888888" stroke-width="2" stroke-dasharray="8,8"/>
  <line x1="900" y1="230" x2="900" y2="1845" stroke="#888888" stroke-width="2" stroke-dasharray="8,8"/>
  <line x1="1500" y1="230" x2="1500" y2="1845" stroke="#888888" stroke-width="2" stroke-dasharray="8,8"/>
  <rect x="20" y="245" width="1760" height="55" fill="#ffffff" stroke="#000000" stroke-width="2" rx="4"/>
  <text x="900" y="280" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#000000" text-anchor="middle">[GHI CHÚ] Khối 1KB SRAM nghỉ ngơi do sel_sram = 0 (Bộ nhớ SRAM không hoạt động trong chu kỳ nạp lệnh)</text>
  <rect x="20" y="320" width="560" height="170" fill="#ffffff" stroke="#000000" stroke-width="2.5" rx="6"/>
  <text x="42" y="356" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#000000">Bước 1: CPU phát chu kỳ nạp mã lệnh</text>
  <line x1="35" y1="368" x2="565" y2="368" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="42" y="400" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#111111">• mem_valid = 1 & mem_instr = 1 (Nạp mã máy)</text>
  <text x="42" y="434" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#111111">• mem_addr = 0x0025_0000 (Địa chỉ PC nạp lệnh)</text>
  <text x="42" y="468" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#111111">• mem_wstrb = 4'b0000 (Chu kỳ đọc, không ghi)</text>
  <rect x="620" y="620" width="560" height="170" fill="#ffffff" stroke="#000000" stroke-width="2.5" rx="6"/>
  <text x="642" y="656" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#000000">Bước 2: Interconnect giải mã & chọn Flash</text>
  <line x1="635" y1="668" x2="1165" y2="668" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="642" y="700" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#111111">• So khớp: 32'h0025_0000 ∈ [Flash 0x0010_0000..]</text>
  <text x="642" y="734" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#111111">• Bật sel_spimem = 1 (Kích hoạt bộ điều khiển Flash)</text>
  <text x="642" y="768" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#111111">• Khóa sel_sram = 0 (Khối 1KB SRAM nghỉ ngơi)</text>
  <rect x="1220" y="920" width="560" height="170" fill="#ffffff" stroke="#000000" stroke-width="2.5" rx="6"/>
  <text x="1242" y="956" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#000000">Bước 3: spimemio phát xung SPI đọc Flash</text>
  <line x1="1235" y1="968" x2="1765" y2="968" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="1242" y="1000" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#111111">• FSM kéo flash_csb = 0, phát chuỗi xung flash_clk</text>
  <text x="1242" y="1034" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#111111">• Fast Read phát qua io0, nhận dữ liệu qua io1</text>
  <text x="1242" y="1068" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#111111">• CPU rơi vào Stall (cpu_state = Stall trong picorv32.v)</text>
  <rect x="1220" y="1115" width="560" height="135" fill="#ffffff" stroke="#000000" stroke-width="2.5" rx="6"/>
  <text x="1242" y="1151" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#000000">Bước 4: Flash trả về từ mã máy 32-bit</text>
  <line x1="1235" y1="1163" x2="1765" y2="1163" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="1242" y="1195" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#111111">• spimem_rdata = Mã opcode 32-bit của lệnh 'lw'</text>
  <text x="1242" y="1229" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#111111">• Bật spimem_ready = 1 (Hoàn tất đọc 4 byte Flash)</text>
  <rect x="620" y="1380" width="560" height="135" fill="#ffffff" stroke="#000000" stroke-width="2.5" rx="6"/>
  <text x="642" y="1416" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#000000">Bước 5: Interconnect ghép mã lệnh về CPU</text>
  <line x1="635" y1="1428" x2="1165" y2="1428" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="642" y="1460" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#111111">• mem_rdata = spimem_rdata (Chuyển mã lệnh về CPU)</text>
  <text x="642" y="1494" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#111111">• mem_ready = spimem_ready = 1 (Báo CPU chốt lệnh)</text>
  <rect x="20" y="1645" width="560" height="170" fill="#ffffff" stroke="#000000" stroke-width="2.5" rx="6"/>
  <text x="42" y="1681" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#000000">Bước 6: CPU nhận mã lệnh vào IR & Giải phóng</text>
  <line x1="35" y1="1693" x2="565" y2="1693" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="42" y="1725" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#111111">• Chốt reg_op = mem_rdata (Thanh ghi lệnh IR)</text>
  <text x="42" y="1759" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#111111">• Hạ mem_valid = 0 (Kết thúc chu kỳ bus nạp lệnh)</text>
  <text x="42" y="1793" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#111111">• CHẶNG 1 HOÀN TẤT (MÃ LỆNH ĐÃ VÀO CPU)!</text>
  <line x1="300" y1="560" x2="900" y2="560" stroke="#000000" stroke-width="3.5" marker-end="url(#arrowhead)"/>
  <rect x="340" y="506" width="520" height="44" fill="#ffffff" fill-opacity="0.96" stroke="#b0b0b0" stroke-width="1.2" rx="5"/>
  <text x="600" y="529" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#000000" text-anchor="middle">rdm6300_picorv32_soc.v#mem_valid, #mem_addr</text>
  <text x="600" y="547" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#2b6cb0" text-anchor="middle">(từ picorv32 ➔ soc_interconnect)</text>
  <line x1="900" y1="860" x2="1500" y2="860" stroke="#000000" stroke-width="3.5" marker-end="url(#arrowhead)"/>
  <rect x="940" y="806" width="520" height="44" fill="#ffffff" fill-opacity="0.96" stroke="#b0b0b0" stroke-width="1.2" rx="5"/>
  <text x="1200" y="829" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#000000" text-anchor="middle">rdm6300_picorv32_soc.v#sel_spimem</text>
  <text x="1200" y="847" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#2b6cb0" text-anchor="middle">(từ soc_interconnect ➔ spimemio)</text>
  <line x1="1500" y1="1320" x2="900" y2="1320" stroke="#000000" stroke-width="3.5" marker-end="url(#arrowhead)"/>
  <rect x="940" y="1266" width="520" height="44" fill="#ffffff" fill-opacity="0.96" stroke="#b0b0b0" stroke-width="1.2" rx="5"/>
  <text x="1200" y="1289" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#000000" text-anchor="middle">rdm6300_picorv32_soc.v#spimem_rdata, #spimem_ready</text>
  <text x="1200" y="1307" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#2b6cb0" text-anchor="middle">(từ spimemio ➔ soc_interconnect)</text>
  <line x1="900" y1="1585" x2="300" y2="1585" stroke="#000000" stroke-width="3.5" marker-end="url(#arrowhead)"/>
  <rect x="340" y="1531" width="520" height="44" fill="#ffffff" fill-opacity="0.96" stroke="#b0b0b0" stroke-width="1.2" rx="5"/>
  <text x="600" y="1554" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#000000" text-anchor="middle">rdm6300_picorv32_soc.v#mem_rdata, #mem_ready</text>
  <text x="600" y="1572" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#2b6cb0" text-anchor="middle">(từ soc_interconnect ➔ picorv32)</text>
</svg>